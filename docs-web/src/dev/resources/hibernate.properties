hibernate.connection.driver_class=org.h2.Driver
# Use file-based H2 to persist data across restarts. It will be stored under the configured `docs.home` directory (e.g. data/docs/db/docs)
hibernate.connection.url=jdbc:h2:file:${docs.home}/db/docs;CACHE_SIZE=65536;LOCK_TIMEOUT=10000
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.hbm2ddl.auto=update
# Use the H2 dialect
hibernate.dialect=org.hibernate.dialect.H2Dialect
hibernate.show_sql=false
hibernate.format_sql=false
hibernate.max_fetch_depth=5
hibernate.cache.use_second_level_cache=false
hibernate.connection.initial_pool_size=1
hibernate.connection.pool_size=10
hibernate.connection.pool_validation_interval=5
